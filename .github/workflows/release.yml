name: release

# Tag-driven releases (Principles #22): pushing an annotated vX.Y.Z tag
# ships the addon. Nothing else triggers this workflow.
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    # Token names: the v2 action still reads the legacy CF_API_KEY
    # and GITHUB_OAUTH (verified in its release.sh; the new
    # CF_API_TOKEN/GH_API_TOKEN names only land in later code), so
    # both generations are set from the same secrets and a packager
    # upgrade cannot silently stop uploads. CF_API_TOKEN stays empty
    # until the CurseForge one-time setup in the Toolchain wiki page
    # is done; the packager skips CurseForge while it is empty and
    # still ships the GitHub release. The GitHub entries get the
    # automatic GITHUB_TOKEN (read-write permission, so the packager
    # can publish the release).
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the changelog is the commits since the previous tag

      # Principles #20: no release ships red. Same gates as test.yml.
      - name: install lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check

      - name: headless tests (Lua 5.1, the client's dialect)
        run: lua5.1 tests/run.lua

      - name: lint
        run: luacheck .

      - name: format check
        run: |
          cargo install stylua
          stylua --check core modules tests

      - name: lint with wowlua-ls (forever flavor)
        run: |
          curl -sSL -o /tmp/wowlua_ls https://github.com/TradeSkillMaster/wowlua-ls/releases/download/v0.35.0/wowlua_ls-x86_64-unknown-linux-gnu
          chmod +x /tmp/wowlua_ls
          /tmp/wowlua_ls check . --severity warning

      - name: vocui checks
        run: bash checks/run-all.sh .

      - name: Package and release
        uses: BigWigsMods/packager@v2

      # Deterministic changelog (wiki/Toolchain.md): one formatter
      # feeds both the GitHub release notes and the Discord embed, so
      # the two surfaces always carry the same bullets. Commits
      # counted are the ones between the previous version tag and
      # this tag; a first tag with no predecessor counts everything.
      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git tag --list 'v[0-9]*' --sort=v:refname | grep -B1 -x "${TAG}" | head -n 1 || true)"
          if [ -z "${PREV}" ] || [ "${PREV}" = "${TAG}" ]; then
            PREV="$(git rev-list --max-parents=0 HEAD)"
          fi
          bash tools/changelog.sh "${PREV}" "${TAG}" "${TAG}" modules /tmp/release-notes.md /tmp/release-desc.txt
          if [ -s /tmp/release-notes.md ]; then
            echo "has-notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-notes=false" >> "$GITHUB_OUTPUT"
          fi

      # The packager already published the release above; this only
      # replaces its notes body with the same text the embed carries.
      # No player-facing commits means no edit: the release ships
      # with the packager notes as before.
      - name: Set release notes
        if: steps.changelog.outputs.has-notes == 'true'
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One embed under the name VocUI. A Discord failure warns and
      # the release still completes; an empty secret skips with a
      # warning. Nothing posts on untagged pushes: this workflow only
      # runs on version tags.
      - name: Post changelog to Discord
        if: steps.changelog.outputs.has-notes == 'true'
        run: |
          URL="${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}"
          if [ -z "${URL}" ]; then
            echo "::warning::DISCORD_CHANGELOG_WEBHOOK is empty; skipping the changelog post."
            exit 0
          fi
          TITLE="VocUI ${GITHUB_REF_NAME}"
          LINK="https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          PAYLOAD="$(jq -n --arg u 'VocUI' --arg t "${TITLE}" --arg l "${LINK}" --arg d "$(cat /tmp/release-desc.txt)" \
            '{username: $u, embeds: [{title: $t, url: $l, description: $d, color: 16765184}]}')" # 16765184 = 0xFFD100 gold
          curl -fsSL -m 30 -X POST -H 'Content-Type: application/json' -d "${PAYLOAD}" "${URL}" \
            || echo "::warning::Discord changelog post failed; the release itself is unaffected."
